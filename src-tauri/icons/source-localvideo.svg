<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="512" rx="200" fill="url(#sheen)"/>

  <!-- painel (a mesa de edição) -->
  <rect x="192" y="240" width="640" height="544" rx="44" fill="#ffffff" opacity="0.96"/>

  <!-- botao de play (o video) -->
  <path d="M436 356 L620 462 L436 568 Z" fill="#0ea5e9"/>

  <!-- timeline: trilhas com clipes (o que faz ser EDITOR, nao player) -->
  <g>
    <rect x="248" y="636" width="196" height="44" rx="12" fill="#0ea5e9"/>
    <rect x="460" y="636" width="120" height="44" rx="12" fill="#7dd3fc"/>
    <rect x="596" y="636" width="180" height="44" rx="12" fill="#0ea5e9"/>
    <rect x="248" y="696" width="150" height="40" rx="12" fill="#bae6fd"/>
    <rect x="414" y="696" width="240" height="40" rx="12" fill="#7dd3fc"/>
    <rect x="670" y="696" width="106" height="40" rx="12" fill="#bae6fd"/>
  </g>

  <!-- playhead -->
  <rect x="516" y="608" width="10" height="160" rx="5" fill="#0c4a6e"/>
  <circle cx="521" cy="608" r="20" fill="#0c4a6e"/>

  <!-- assinatura da marca -->
  <text x="512" y="908" font-family="Segoe Script, cursive" font-size="80"
        fill="#ffffff" opacity="0.55" text-anchor="middle">Taylor</text>
</svg>
