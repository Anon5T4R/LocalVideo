[package]
name = "localvideo"
version = "0.15.6"
description = "LocalVideo — editor de vídeo 100% offline da suíte Local"
authors = ["Taylor"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Anon5T4R/LocalVideo"

[lib]
# O sufixo `_lib` evita conflito entre o nome da lib e o do binário no Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "localvideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset`: é o que deixa o `<video>` da prévia (e as miniaturas da
# régua) abrirem arquivo do disco via `convertFileSrc`. Sem a feature, o
# `assetProtocol` do tauri.conf.json não sobe e o build recusa na cara.
tauri = { version = "2", features = ["protocol-asset"] }
# Escolher arquivo de vídeo pra importar e onde salvar o .tvproj. Sem isto o
# app só abriria mídia por arrastar-e-soltar — meio produto.
tauri-plugin-dialog = "2"
# Depois de exportar, "Abrir vídeo" e "Mostrar na pasta": o opener resolve isso
# com o app/gerenciador padrão do SO (o padrão da suíte — igual LocalMedia/
# LocalFiles). Sem ele, o usuário exporta e fica sem saber ONDE o arquivo caiu.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# CSD limpa: contorna a titlebar quebrada do tao <= 0.35 no GNOME/Wayland
# (ver lib.rs). Mesma versao que o tauri ja puxa. Sai junto com o upgrade ao tao 0.36.
gtk = "0.18"
